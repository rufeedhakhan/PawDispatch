<h1>PawDispatch system architecture</h1>
<p>From a WhatsApp report to a confirmed dispatch. Green boxes are AI, blue boxes are human-controlled, amber boxes are standard software.</p>
<svg viewBox="0 0 1240 600" role="img" aria-label="PawDispatch architecture diagram">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fb0b3"/></marker></defs>
<text class="h" x="120" y="40">1. Intake</text><text class="h" x="370" y="40">2. Gateway</text><text class="h" x="620" y="40">3. AI services</text><text class="h" x="870" y="40">4. Decision</text><text class="h" x="1120" y="40">5. Output</text>

<g><rect class="n" x="20" y="60" width="200" height="64" rx="8"/><text class="t" x="34" y="88">WhatsApp bot</text><text class="s" x="34" y="107">Text, photo, voice, location pin</text>
<rect class="n" x="20" y="138" width="200" height="64" rx="8"/><text class="t" x="34" y="166">SMS fallback</text><text class="s" x="34" y="185">For low-data areas</text></g>

<g><rect class="n" x="270" y="60" width="200" height="64" rx="8"/><text class="t" x="284" y="88">WhatsApp Business API</text><text class="s" x="284" y="107">Webhook receiver</text>
<rect class="n" x="270" y="138" width="200" height="64" rx="8"/><text class="t" x="284" y="166">Node.js + Express API</text><text class="s" x="284" y="185">Auth, job queue, consent check</text></g>

<g><rect class="a" x="520" y="60" width="200" height="64" rx="8"/><text class="t" x="534" y="88">Speech-to-text</text><text class="s" x="534" y="107">English, Hindi, Konkani</text>
<rect class="a" x="520" y="138" width="200" height="64" rx="8"/><text class="t" x="534" y="166">NLP extractor</text><text class="s" x="534" y="185">Species, condition, place</text>
<rect class="a" x="520" y="216" width="200" height="64" rx="8"/><text class="t" x="534" y="244">Vision model</text><text class="s" x="534" y="263">Injury severity from photo</text>
<rect class="a" x="520" y="294" width="200" height="64" rx="8"/><text class="t" x="534" y="322">Triage scorer</text><text class="s" x="534" y="341">Priority score with reasons</text></g>

<g><rect class="a" x="770" y="60" width="200" height="64" rx="8"/><text class="t" x="784" y="88">Dispatch matcher</text><text class="s" x="784" y="107">Nearest team, vehicle, shelter bed</text>
<rect class="u" x="770" y="150" width="200" height="64" rx="8"/><text class="t" x="784" y="178">Coordinator approval</text><text class="s" x="784" y="197">Human confirms every dispatch</text>
<rect class="a" x="770" y="240" width="200" height="64" rx="8"/><text class="t" x="784" y="268">Hotspot forecaster</text><text class="s" x="784" y="287">Clusters and trends</text></g>

<g><rect class="u" x="1020" y="60" width="200" height="64" rx="8"/><text class="t" x="1034" y="88">Coordinator dashboard</text><text class="s" x="1034" y="107">Live map and case queue</text>
